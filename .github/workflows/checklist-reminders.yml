name: checklist-reminders

# Android exact-time reminders need a push every few minutes.
# Vercel Hobby only allows one daily cron — this fills the gap.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   APP_URL      — e.g. https://recomp-tracker.vercel.app  (no trailing slash)
#   CRON_SECRET  — same value as CRON_SECRET in Vercel env
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Fire due-window push cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Skipping — add Actions secrets APP_URL and CRON_SECRET to enable Android due-time push."
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/checklist-reminders?mode=window&window=15"
